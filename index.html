    <meta name="twitter:image" content="og-thumbnail.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ভাই-বন্ধু সমবায় সমিতি",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "All",
      "description": "ভাই-বন্ধু সমবায় সমিতির অফিসিয়াল ওয়েবসাইট ও হিসাব ব্যবস্থাপনা পোর্টাল - মধ্য মুজির কান্দি, পাঠান বাজার, মতলব উত্তর, চাঁদপুর",
      "image": "og-thumbnail.jpg"
    }
    </script>
    <script>
      try {
        const fullImgUrl = new URL('og-thumbnail.jpg', window.location.href).href;
        const ogImg = document.querySelector('meta[property="og:image"]');
        if (ogImg) ogImg.setAttribute('content', fullImgUrl);
        const ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
        if (ogImgSec) ogImgSec.setAttribute('content', fullImgUrl);
        const twitterImg = document.querySelector('meta[name="twitter:image"]');
        if (twitterImg) twitterImg.setAttribute('content', fullImgUrl);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased bg-stone-50 text-stone-900 selection:bg-emerald-700 selection:text-white">
    <div id="root"></div>

  </body>
